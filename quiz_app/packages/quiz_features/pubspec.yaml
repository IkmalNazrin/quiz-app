name: quiz_features
description: "Feature presentation layers for Quiz App"
version: 1.0.0
# publish_to: "none"

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  quiz_domain:
    path: ../quiz_domain
  quiz_ui_core:
    path: ../quiz_ui_core
  quiz_infrastructure:
    path: ../quiz_infrastructure
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  go_router: ^17.1.0
  confetti: ^0.8.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  fl_chart: ^1.1.1
  file_picker: ^10.3.10
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  google_sign_in: ^6.2.1
  jwt_decoder: ^2.0.1
  dartz: ^0.10.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_app_check: ^0.4.1+5
  mocktail: ^1.0.4
  fpdart: ^1.2.0

flutter:
  uses-material-design: true
